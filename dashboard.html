<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dashboard — StudyForgeAI</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/app.css" />
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="scrim" id="scrim"></div>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <div class="page page-wide" id="root"></div>
  </div>
</div>
<div class="modal" id="modal"></div>
<script src="assets/app.js"></script>
<script>
  var app = SF.mountApp({ active: 'dashboard', title: 'Dashboard', crumb: 'StudyForgeAI · Today' });
  if (!app) throw new Error('auth');

  var d = app.data;
  var root = document.getElementById('root');

  /* ---------------------------------------------------------- empty state */
  if (!d.exams.length) {
    root.innerHTML =
      '<div class="empty reveal">' +
      '<div class="ico">' + SF.icons.calendar + '</div>' +
      '<h2 style="font-size:1.4rem">Let\'s set up your first exam</h2>' +
      '<p class="muted small mt8" style="max-width:440px;margin:0 auto">Add a subject, an exam date and your topics. The AI will build a day-by-day plan and start tracking what you\'re weak at.</p>' +
      '<a class="btn btn-primary btn-lg mt24" href="create-exam.html">' + SF.icons.plus + ' Create my first exam</a>' +
      '<p class="tiny muted mt16">Free plan · one active exam · no card needed</p>' +
      '</div>';
  } else {

  var exam = d.exams.find(function (e) { return e.id === d.activeExamId; }) || d.exams[0];
  var ready = SF.ai.readiness(exam);
  var weak = SF.ai.weakestTopic(exam);
  var today = SF.ai.todayPlan(exam);
  var days = SF.daysBetween(SF.todayISO(), exam.date);
  var streak = SF.studyStreak();
  var rp = SF.progressNote(ready);
  var col = SF.subjectColor(exam.subject);

  var todayItems = today ? today.items : [];
  var todayDone = todayItems.filter(function (i) { return i.done; }).length;
  var todayPct = todayItems.length ? Math.round(todayDone / todayItems.length * 100) : 0;

  function planRow(it) {
    var iconCls = it.done ? 'done' : it.type === 'quiz' ? 'soon' : 'now';
    return '<div class="plan-item' + (it.done ? ' done' : '') + '" data-item="' + it.id + '">' +
      '<button class="plan-check' + (it.done ? ' on' : '') + '" data-check="' + it.id + '" aria-label="Toggle complete">' +
      (it.done ? SF.icons.check : '') + '</button>' +
      '<div class="grow" style="min-width:0"><div class="plan-title">' + SF.esc(it.title) + '</div>' +
      '<div class="plan-meta">' + SF.esc(it.topic || '') + ' · ' + it.minutes + ' min</div></div>' +
      '<span class="badge tiny">' + typeLabel(it.type) + '</span>' +
      '</div>';
  }
  function typeLabel(t) {
    return ({ study: 'study', quiz: 'quiz', flashcards: 'cards', review: 'review', mock: 'mock exam' })[t] || t;
  }

  root.innerHTML =
    /* ---- greeting hero ---- */
    '<div class="grid reveal" style="grid-template-columns:1.5fr 1fr;gap:20px">' +
      '<div class="card" style="border-color:' + hexA(col, .4) + '">' +
        '<div class="row between wrapflex gap16">' +
          '<div style="min-width:0">' +
            '<div class="row gap8 small muted"><span>' + SF.greeting() + ' 👋</span><span class="dot" style="background:' + col + '"></span><span>' + SF.esc(exam.subject) + '</span></div>' +
            '<h2 style="font-size:1.85rem;margin-top:6px">' + SF.esc(exam.name) + '</h2>' +
            '<div class="row gap12 mt12 wrapflex">' +
              '<span class="badge ' + (days <= 3 ? 'badge-rose' : days <= 7 ? 'badge-amber' : 'badge-blue') + '">' + SF.icons.clock + (days > 0 ? days + ' days remaining' : 'exam today') + '</span>' +
              '<span class="badge">' + SF.fmtDate(exam.date, { weekday: 'short', day: 'numeric', month: 'short' }) + '</span>' +
              '<span class="badge">' + SF.icons.flame + streak + ' day streak</span>' +
            '</div>' +
          '</div>' +
          '<div class="ring" style="--pct:' + ready + '">' +
            '<div><b>' + ready + '%</b><span>readiness</span></div>' +
          '</div>' +
        '</div>' +
        '<div class="mt20">' +
          '<div class="row between small mb8"><span class="muted">Exam readiness</span><span class="badge ' + rp.cls + '">' + rp.label + '</span></div>' +
          '<div class="progress"><i style="width:' + ready + '%"></i></div>' +
          '<div class="row between tiny muted mt8"><span>' + exam.topics.filter(function (t) { return t.attempts; }).length + ' of ' + exam.topics.length + ' topics tested</span><span>' + exam.topics.filter(function (t) { return t.mastery >= 80; }).length + ' topics strong</span></div>' +
        '</div>' +
        '<div class="row gap12 mt20 wrapflex">' +
          '<a class="btn btn-primary btn-lg" href="quiz.html?exam=' + exam.id + '">' + SF.icons.bolt + "Start Today's Study" + '</a>' +
          '<a class="btn btn-ghost" href="exam.html?id=' + exam.id + '">View full plan</a>' +
          '<button class="btn btn-quiet" onclick="SF.ai.regenerateRestOfPlan(SF.examById(SF.data().activeExamId))" id="regen">' + SF.icons.refresh + 'Re-plan</button>' +
        '</div>' +
      '</div>' +

      /* ---- weakest topic ---- */
      (weak ? '<div class="card card-accent reveal" style="border-color:rgba(251,113,133,.35)">' +
        '<div class="row between mb12"><b class="small">⚠ Weakest topic</b><span class="badge ' + (weak.mastery < 60 ? 'badge-rose' : 'badge-amber') + '">' + weak.mastery + '% accuracy</span></div>' +
        '<h3 style="font-size:1.3rem">' + SF.esc(weak.name) + '</h3>' +
        '<p class="muted small mt8">' + (weak.attempts
          ? 'Your recent answers show that ' + SF.esc(weak.name.toLowerCase()) + ' is currently your weakest topic — it is the single biggest drag on your readiness score, costing you roughly ' + (weak.mastery < 55 ? 9 : 5) + ' points.'
          : 'You haven\'t been tested on ' + SF.esc(weak.name.toLowerCase()) + ' yet. A quick diagnostic will tell the AI where to focus.') + '</p>' +
        '<div class="progress thin mt12 ' + (weak.mastery < 60 ? 'amber' : '') + '"><i style="width:' + weak.mastery + '%"></i></div>' +
        '<a class="btn btn-primary btn-block mt20" href="quiz.html?exam=' + exam.id + '&topic=' + encodeURIComponent(weak.name) + '&count=8">Study ' + SF.esc(weak.name) + '</a>' +
        '<a class="btn btn-quiet btn-block btn-sm mt8" href="tutor.html?topic=' + encodeURIComponent(weak.name) + '">Ask the AI tutor to explain it</a>' +
      '</div>' : '') +
    '</div>' +

    /* ---- today's plan ---- */
    '<div class="grid mt20" style="grid-template-columns:1.5fr 1fr;gap:20px">' +
      '<div class="card reveal">' +
        '<div class="row between mb16 wrapflex gap12">' +
          '<div><h3>Today\'s Study Plan</h3><div class="tiny muted mt4">' + (today ? SF.fmtDay(today.date) : 'No session scheduled') + ' · ' + todayItems.reduce(function (a, i) { return a + i.minutes; }, 0) + ' minutes</div></div>' +
          '<div class="row gap10"><span class="badge ' + (todayPct === 100 ? 'badge-green' : 'badge-blue') + '">' + todayDone + '/' + todayItems.length + ' done</span></div>' +
        '</div>' +
        '<div class="progress thin mb16 ' + (todayPct === 100 ? 'green' : '') + '"><i style="width:' + todayPct + '%"></i></div>' +
        '<div class="stack gap10" id="planList">' + todayItems.map(planRow).join('') + '</div>' +
        '<div class="row gap10 mt20 wrapflex">' +
          '<a class="btn btn-primary grow" href="quiz.html?exam=' + exam.id + '">Start Today\'s Study</a>' +
          '<a class="btn btn-ghost" href="flashcards.html?exam=' + exam.id + '">' + SF.icons.cards + 'Flashcards</a>' +
        '</div>' +
      '</div>' +

      /* ---- quick tools + focus ---- */
      '<div class="stack gap20">' +
        '<div class="card reveal">' +
          '<div class="row between mb12"><h3>Weak spots</h3><a class="tiny" style="color:var(--blue-300);font-weight:600" href="progress.html">See all →</a></div>' +
          exam.topics.slice().sort(function (a, b) { return a.mastery - b.mastery; }).slice(0, 4).map(function (t) {
            var cls = t.mastery < 55 ? 'amber' : t.mastery < 80 ? '' : 'green';
            return '<div style="padding:9px 0"><div class="row between small mb8"><span class="dim">' + SF.esc(t.name) + '</span><span class="mono tiny muted">' + t.mastery + '%</span></div>' +
              '<div class="progress thin ' + cls + '"><i style="width:' + t.mastery + '%"></i></div></div>';
          }).join('') +
        '</div>' +
        '<div class="card reveal">' +
          '<h3 class="mb12">Jump back in</h3>' +
          '<div class="grid" style="grid-template-columns:1fr 1fr;gap:10px">' +
            toolTile('quiz', 'Adaptive quiz', 'quiz.html?exam=' + exam.id) +
            toolTile('cards', 'Flashcards', 'flashcards.html?exam=' + exam.id) +
            toolTile('exam', 'Practice exam', 'quiz.html?exam=' + exam.id + '&mode=practice') +
            toolTile('tutor', 'AI tutor', 'tutor.html?exam=' + exam.id) +
          '</div>' +
        '</div>' +
      '</div>' +
    '</div>' +

    /* ---- upcoming exams ---- */
    '<div class="row between mt32 mb16 wrapflex gap12 reveal"><h3>Upcoming exams</h3>' +
      '<a class="btn btn-ghost btn-sm" href="create-exam.html">' + SF.icons.plus + 'Add exam</a></div>' +
    '<div class="grid g-auto reveal" id="examGrid">' +
      d.exams.slice().sort(function (a, b) { return (a.date || '').localeCompare(b.date || ''); }).map(function (e) {
        var pc = SF.ai.readiness(e), dd = SF.daysBetween(SF.todayISO(), e.date), c2 = SF.subjectColor(e.subject);
        return '<a class="card exam-card' + (e.id === exam.id ? ' card-accent' : '') + '" href="exam.html?id=' + e.id + '">' +
          '<div class="row between"><div class="row gap8"><span class="subject-dot" style="background:' + c2 + '"></span><b>' + SF.esc(e.subject) + '</b></div>' +
          (e.id === exam.id ? '<span class="badge badge-blue tiny">active</span>' : '<span class="badge tiny">' + (dd > 0 ? dd + ' days' : 'today') + '</span>') + '</div>' +
          '<div><div class="small dim" style="font-weight:600">' + SF.esc(e.name) + '</div>' +
          '<div class="tiny muted mt4">' + SF.fmtDate(e.date) + ' · ' + (e.topics || []).length + ' topics</div></div>' +
          '<div><div class="row between tiny muted mb8"><span>Preparation</span><span class="mono">' + pc + '%</span></div>' +
          '<div class="progress thin"><i style="width:' + pc + '%"></i></div></div>' +
          '</a>';
      }).join('') +
    '</div>';
  }

  function toolTile(icon, label, href) {
    return '<a class="card card-flat card-pad-sm card-hover" href="' + href + '" style="display:block">' +
      '<span style="color:var(--blue-300)">' + SF.icons[icon] + '</span>' +
      '<div class="small bold mt8">' + label + '</div></a>';
  }
  function hexA(hex, a) {
    var r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
  }

  /* ---------------------------------------------------------- interactions */
  root.addEventListener('click', function (e) {
    var check = e.target.closest('[data-check]');
    if (check) {
      var id = check.dataset.check;
      var dd = SF.data();
      var ex = dd.exams.find(function (x) { return x.id === exam.id; });
      var found = null;
      ex.plan.forEach(function (p) { p.items.forEach(function (i) { if (i.id === id) found = i; }); });
      if (found) {
        found.done = !found.done;
        ex.readiness = SF.ai.readiness(ex);
        SF.saveData(dd);
        SF.toast(found.done ? '✓ Marked “' + SF.esc(found.title) + '” complete' : 'Unmarked session');
        setTimeout(function () { location.reload(); }, 320);
      }
      return;
    }
    if (e.target.closest('#regen')) {
      var dd2 = SF.data();
      var ex2 = dd2.exams.find(function (x) { return x.id === exam.id; });
      SF.ai.regenerateRestOfPlan(ex2);
      ex2.readiness = SF.ai.readiness(ex2);
      SF.saveData(dd2);
      SF.toast('✨ Remaining plan rebuilt around your latest results.');
      setTimeout(function () { location.reload(); }, 520);
    }
  });

  /* responsive layout class swap */
  if (window.matchMedia('(max-width: 900px)').matches) {
    document.querySelectorAll('#root > .grid').forEach(function (g) { g.style.gridTemplateColumns = '1fr'; });
  }
  SF.reveal();
</script>
</body>
</html>
