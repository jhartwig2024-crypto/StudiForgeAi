<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" href="app.css">
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Log in — StudyForgeAI</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/app.css" />
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <a class="brand mb24" href="index.html" style="justify-content:center;display:flex"><span class="brand-mark">S</span><span>AI Exam Prep<small>StudyForgeAI</small></span></a>

    <div class="card">
      <h2 style="font-size:1.5rem">Welcome back</h2>
      <p class="muted small mt8">Pick up where your study plan left off.</p>

      <div id="alert" class="alert alert-error mt16 hide"></div>

      <form id="form" class="stack gap16 mt20" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <div class="input-icon">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/></svg>
            <input class="input" id="email" type="email" placeholder="you@school.com" autocomplete="email" required />
          </div>
        </div>
        <div class="field">
          <div class="row between"><label for="pw">Password</label><a class="tiny" href="forgot-password.html" style="color:var(--blue-300);font-weight:600">Forgot?</a></div>
          <div class="input-icon">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V7.8a4 4 0 0 1 8 0v2.7"/></svg>
            <input class="input" id="pw" type="password" placeholder="Your password" autocomplete="current-password" required />
          </div>
        </div>
        <label class="row gap10 small muted" style="cursor:pointer">
          <input type="checkbox" id="remember" checked style="width:16px;height:16px;accent-color:#38bdf8" /> Keep me signed in on this device
        </label>
        <button class="btn btn-primary btn-block btn-lg" type="submit">Log in</button>
      </form>

      <div class="divider mt20">or</div>

      <button class="btn btn-google btn-block mt16" id="googleBtn">
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.7-6.7C35.6 2.6 30.1 0 24 0 14.6 0 6.4 5.4 2.5 13.2l7.8 6.1C12.2 13.2 17.6 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/><path fill="#FBBC05" d="M10.3 28.7A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.8-4.7l-7.8-6.1A24 24 0 0 0 0 24c0 3.9.9 7.5 2.5 10.8l7.8-6.1z"/><path fill="#34A853" d="M24 48c6.1 0 11.3-2 15.1-5.5l-7.5-5.8c-2 1.4-4.7 2.3-7.6 2.3-6.4 0-11.8-3.7-13.7-9.1l-7.8 6.1C6.4 42.6 14.6 48 24 48z"/></svg>
        Continue with Google
      </button>

      <p class="small muted center mt20" style="text-align:center">New here? <a href="signup.html" style="color:var(--blue-300);font-weight:600">Create an account</a></p>
    </div>

    <p class="tiny muted center mt16" style="text-align:center">🔒 Demo build — credentials never leave your browser.</p>
  </div>
</div>

<div class="modal" id="modal"></div>
<script src="assets/app.js"></script>
<script>
  var alertBox = document.getElementById('alert');
  function showErr(m){ alertBox.textContent = m; alertBox.classList.remove('hide'); }
  function nextAfterLogin(){ var p = new URLSearchParams(location.search).get('next'); return p || null; }

  document.getElementById('form').addEventListener('submit', function (e) {
    e.preventDefault();
    alertBox.classList.add('hide');
    var email = document.getElementById('email').value.trim(), pw = document.getElementById('pw').value;
    var res = SF.auth.login(email, pw);
    if (!res.ok) return showErr(res.error);
    SF.toast('Signed in. Loading your plan…');
    var d = SF.data();
    var dest = nextAfterLogin() || (d.profile.onboarded ? 'dashboard.html' : 'onboarding.html');
    setTimeout(function(){ location.href = dest; }, 550);
  });

  document.getElementById('googleBtn').onclick = function () {
    SF.modal('Continue with Google',
      '<p class="muted small">Google sign-in runs a demo flow in this build. Enter the Google address to continue.</p>' +
      '<div class="field mt16"><label for="gEmail">Google email</label><input class="input" id="gEmail" type="email" placeholder="you@gmail.com" /></div>',
      '<button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-primary grow" id="gGo">Continue</button>');
    document.getElementById('gGo').onclick = function () {
      var em = document.getElementById('gEmail').value.trim();
      if (!/^\S+@\S+\.\S+$/.test(em)) return SF.toast('Enter a valid email address.');
      SF.auth.google(em);
      var d = SF.data();
      SF.closeModal();
      setTimeout(function(){ location.href = d.profile.onboarded ? 'dashboard.html' : 'onboarding.html'; }, 500);
    };
  };
</script>
</body>
</html>
