<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="app.css">
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Account — StudyForgeAI</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/app.css" />
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="scrim" id="scrim"></div>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <div class="page" id="root"></div>
  </div>
</div>
<div class="modal" id="modal"></div>
<script src="assets/app.js"></script>
<script>
  var app = SF.mountApp({ active: 'account', title: 'Account', crumb: 'StudyForgeAI · Settings' });
  if (!app) throw new Error('auth');
  var d = app.data, user = app.user, root = document.getElementById('root');
  var pro = SF.isPro();

  root.innerHTML =
    '<div class="grid" style="grid-template-columns:1fr 260px;gap:20px;align-items:start">' +

      '<div class="stack gap20">' +
        /* ---------------- profile ---------------- */
        '<div class="card reveal" id="profile">' +
          '<h3>Profile</h3>' +
          '<p class="muted small mt8">Used to pitch questions at the right level.</p>' +
          '<div class="form-grid mt20">' +
            '<div class="field"><label for="name">Name</label><input class="input" id="name" value="' + SF.esc(user.name || '') + '" /></div>' +
            '<div class="field"><label for="email">Email</label><input class="input" id="email" value="' + SF.esc(user.email) + '" disabled /></div>' +
            '<div class="field"><label for="year">Year level</label><select class="select" id="year">' +
              ['Year 9','Year 10','Year 11','Year 12','Year 13','College / University'].map(function (y) {
                return '<option' + (d.profile.yearLevel === y ? ' selected' : '') + '>' + y + '</option>';
              }).join('') + '</select></div>' +
            '<div class="field"><label for="minutes">Usual study time per day</label><select class="select" id="minutes">' +
              [20,30,45,60,90,120].map(function (m) {
                return '<option value="' + m + '"' + (d.profile.dailyMinutes === m ? ' selected' : '') + '>' + SF.minutesLabel(m) + '</option>';
              }).join('') + '</select></div>' +
            '<div class="field span2"><label>Subjects</label>' +
              '<div class="chips" id="subjects">' + ['Mathematics','English','Biology','Chemistry','Physics','History','Geography','Economics','Business Studies','Computer Science','Psychology','Languages'].map(function (s) {
                var on = (d.profile.subjects || []).indexOf(s) !== -1;
                return '<button class="chip' + (on ? ' on' : '') + '" data-value="' + s + '" aria-pressed="' + (on ? 'true' : 'false') + '">' + s + '</button>';
              }).join('') + '</div>' +
              '<div class="row gap8 mt12"><input class="input" id="subjectAdd" placeholder="Add another subject" /><button class="btn btn-ghost" id="subjectAddBtn">Add</button></div>' +
            '</div>' +
          '</div>' +
          '<div class="row gap10 mt20 wrapflex"><button class="btn btn-primary" id="saveProfile">Save changes</button>' +
          '<button class="btn btn-quiet" id="reset">Discard</button></div>' +
        '</div>' +

        /* ---------------- subscription ---------------- */
        '<div class="card reveal" id="subscription">' +
          '<div class="row between wrapflex gap12"><h3>Subscription</h3>' +
            (pro ? '<span class="badge badge-blue">' + SF.icons.sparkle + 'Pro active</span>' : '<span class="badge">Free plan</span>') + '</div>' +
          '<div class="grid g2 mt20">' +
            '<div class="card card-flat' + (pro ? '' : ' ') + '" style="' + (pro ? 'opacity:.6' : 'border-color:rgba(56,189,248,.35)') + '">' +
              '<b>Free</b><div class="price-amount" style="font-size:2rem">$0<span>/month</span></div>' +
              '<ul class="price-list small"><li>Limited AI questions</li><li>Limited quizzes</li><li>One active exam</li><li>Basic study plan</li><li>Limited uploads</li></ul>' +
              (pro ? '<button class="btn btn-ghost btn-block mt16" id="switchFree">Switch to Free</button>' : '<div class="badge badge-blue mt16" style="width:100%;justify-content:center">Current plan</div>') +
            '</div>' +
            '<div class="card card-flat" style="' + (pro ? 'border-color:rgba(56,189,248,.45);box-shadow:var(--glow)' : '') + '">' +
              '<b>Pro</b><div class="price-amount" style="font-size:2rem">$3.99<span>/month</span></div>' +
              '<ul class="price-list small"><li>Unlimited AI questions &amp; quizzes</li><li>Unlimited flashcards</li><li>Unlimited practice exams</li><li>Unlimited uploads</li><li>Personalised study plans</li><li>Weak-topic detection</li><li>Adaptive quizzes</li><li>Exam readiness score</li><li>AI tutor</li><li>Progress tracking</li></ul>' +
              (pro ? '<div class="badge badge-green mt16" style="width:100%;justify-content:center">Current plan</div>' : '<button class="btn btn-primary btn-block mt16" onclick="SF.upgrade()">Upgrade — $3.99/month</button>') +
            '</div>' +
          '</div>' +
          '<div class="card card-flat mt16"><div class="row between wrapflex gap12">' +
            '<div><b class="small">AI questions used</b><div class="tiny muted">' + (d.aiQuestionsUsed || 0) + (pro ? ' · unlimited on Pro' : ' of ' + SF.limits().aiQuestions + ' on Free') + '</div></div>' +
            '<div style="min-width:200px;flex:1;max-width:320px"><div class="progress thin"><i style="width:' + (pro ? 8 : Math.min(100, Math.round((d.aiQuestionsUsed || 0) / SF.limits().aiQuestions * 100))) + '%"></i></div></div>' +
          '</div></div>' +
          '<div class="row between mt16 wrapflex gap12"><span class="tiny muted">Billing is disabled in this demo build — the plan switch is instant and local.</span>' +
            (pro ? '<button class="btn btn-quiet btn-sm" id="cancelPro">Cancel subscription</button>' : '') + '</div>' +
        '</div>' +

        /* ---------------- security ---------------- */
        '<div class="card reveal" id="security">' +
          '<h3>Security</h3>' +
          '<p class="muted small mt8">' + (user.provider === 'google' ? 'You signed in with Google — password change is disabled for this account.' : 'Change your password.') + '</p>' +
          '<div class="form-grid mt20">' +
            '<div class="field"><label for="cur">Current password</label><input class="input" id="cur" type="password" ' + (user.provider === 'google' ? 'disabled' : '') + ' /></div>' +
            '<div class="field"><label for="nw">New password</label><input class="input" id="nw" type="password" ' + (user.provider === 'google' ? 'disabled' : '') + ' /></div>' +
          '</div>' +
          '<button class="btn btn-ghost mt16" id="pwSave" ' + (user.provider === 'google' ? 'disabled' : '') + '>Update password</button>' +
        '</div>' +

        /* ---------------- danger ---------------- */
        '<div class="card reveal" style="border-color:rgba(251,113,133,.3)">' +
          '<h3>Data &amp; session</h3>' +
          '<p class="muted small mt8">Your study data lives in this browser. Signing out keeps it; clearing removes it permanently.</p>' +
          '<div class="row gap10 mt16 wrapflex">' +
            '<button class="btn btn-ghost" onclick="SF.logout()">' + SF.icons.logout + 'Log out</button>' +
            '<button class="btn btn-quiet" id="export">Export my data (JSON)</button>' +
            '<button class="btn btn-danger" id="wipe">Clear all my study data</button>' +
          '</div>' +
        '</div>' +
      '</div>' +

      /* ---------------- side ---------------- */
      '<div class="stack gap16">' +
        '<div class="card reveal">' +
          '<div class="avatar" style="width:52px;height:52px;font-size:1.2rem">' + SF.esc((user.name || user.email).slice(0, 1).toUpperCase()) + '</div>' +
          '<b style="display:block;margin-top:12px">' + SF.esc(user.name || 'Student') + '</b>' +
          '<div class="tiny muted">' + SF.esc(user.email) + '</div>' +
          '<div class="badge ' + (pro ? 'badge-blue' : '') + ' mt12">' + (pro ? 'Pro member' : 'Free member') + '</div>' +
          '<div class="tiny muted mt12">Joined ' + SF.fmtDate((user.createdAt || SF.todayISO()).slice(0, 10), { month: 'long', year: 'numeric' }) + '</div>' +
        '</div>' +
        '<div class="card card-flat reveal"><h4 class="tiny" style="letter-spacing:.12em;text-transform:uppercase;color:var(--faint)">On this page</h4>' +
          '<a class="side-link mt8" href="#profile">Profile</a>' +
          '<a class="side-link" href="#subscription">Subscription</a>' +
          '<a class="side-link" href="#security">Security</a>' +
        '</div>' +
        '<div class="card card-flat reveal"><h4 class="tiny" style="letter-spacing:.12em;text-transform:uppercase;color:var(--faint)">Your study stats</h4>' +
          '<div class="row between mt12 small"><span class="muted">Exams</span><b>' + d.exams.length + '</b></div>' +
          '<div class="row between mt8 small"><span class="muted">Topics tracked</span><b>' + d.exams.reduce(function (a, e) { return a + e.topics.length; }, 0) + '</b></div>' +
          '<div class="row between mt8 small"><span class="muted">Quizzes taken</span><b>' + d.exams.reduce(function (a, e) { return a + (e.quizzes || []).length; }, 0) + '</b></div>' +
          '<div class="row between mt8 small"><span class="muted">Day streak</span><b>' + (d.streak ? d.streak.count : 1) + '</b></div>' +
        '</div>' +
      '</div>' +
    '</div>';

  var subjChips = SF.chipGroup(document.getElementById('subjects'), { multi: true });
  document.getElementById('subjectAddBtn').onclick = function () {
    var inp = document.getElementById('subjectAdd'), v = inp.value.trim();
    if (!v) return;
    var b = document.createElement('button');
    b.className = 'chip on'; b.dataset.value = v; b.textContent = v; b.setAttribute('aria-pressed', 'true');
    document.getElementById('subjects').appendChild(b);
    b.onclick = function () { b.classList.toggle('on'); b.setAttribute('aria-pressed', b.classList.contains('on') ? 'true' : 'false'); };
    inp.value = '';
  };

  document.getElementById('saveProfile').onclick = function () {
    var dd = SF.data();
    dd.profile.yearLevel = document.getElementById('year').value;
    dd.profile.dailyMinutes = parseInt(document.getElementById('minutes').value, 10);
    dd.profile.subjects = subjChips.values();
    dd.exams.forEach(function (e) { e.dailyMinutes = dd.profile.dailyMinutes; });
    SF.saveData(dd);
    SF.auth.updateProfile({ name: document.getElementById('name').value.trim() });
    SF.toast('✓ Profile saved. Plans re-scaled to ' + SF.minutesLabel(dd.profile.dailyMinutes) + '/day.');
    setTimeout(function () { location.reload(); }, 800);
  };
  document.getElementById('reset').onclick = function () { location.reload(); };

  document.getElementById('pwSave').onclick = function () {
    var cur = document.getElementById('cur').value, nw = document.getElementById('nw').value;
    if (nw.length < 6) return SF.toast('New password needs 6+ characters.');
    var r = SF.auth.changePassword(cur, nw);
    SF.toast(r.ok ? '✓ Password updated.' : r.error);
    if (r.ok) { document.getElementById('cur').value = ''; document.getElementById('nw').value = ''; }
  };

  var sfBtn = document.getElementById('switchFree');
  if (sfBtn) sfBtn.onclick = function () { SF.downgrade(); };
  var cpBtn = document.getElementById('cancelPro');
  if (cpBtn) cpBtn.onclick = function () {
    SF.modal('Cancel Pro?', '<p class="muted small">You\'ll drop back to the Free plan: one active exam, limited AI questions. Everything you\'ve already created stays.</p>',
      '<button class="btn btn-ghost" data-close>Keep Pro</button><button class="btn btn-danger grow" onclick="SF.downgrade()">Cancel subscription</button>');
  };

  document.getElementById('export').onclick = function () {
    var blob = new Blob([JSON.stringify({ profile: SF.data().profile, exams: SF.data().exams }, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'studyforgeai-data.json';
    a.click();
    SF.toast('Exported study data.');
  };
  document.getElementById('wipe').onclick = function () {
    SF.modal('Clear all study data?', '<p class="muted small">This deletes every exam, plan, quiz result and upload for this account. It cannot be undone.</p>',
      '<button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-danger grow" id="wipeYes">Delete everything</button>');
    document.getElementById('wipeYes').onclick = function () {
      SF.saveData(SF.blankData());
      SF.closeModal();
      SF.toast('All study data cleared.');
      setTimeout(function () { location.href = 'dashboard.html'; }, 700);
    };
  };

  if (window.matchMedia('(max-width: 900px)').matches) {
    document.querySelectorAll('#root .grid').forEach(function (g) { if (g.style.gridTemplateColumns && g.style.gridTemplateColumns.indexOf('260px') > -1) g.style.gridTemplateColumns = '1fr'; });
  }
</script>
</body>
</html>
