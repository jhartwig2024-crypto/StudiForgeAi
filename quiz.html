<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Quiz — StudyForgeAI</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/app.css" />
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="scrim" id="scrim"></div>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <div class="page" id="root"></div>
  </div>
</div>
<div class="modal" id="modal"></div>
<script src="assets/app.js"></script>
<script>
  var app = SF.mountApp({ active: location.search.indexOf('mode=practice') > -1 ? 'practice' : 'quiz', title: 'Quiz', crumb: 'StudyForgeAI · Test yourself' });
  if (!app) throw new Error('auth');
  var d = app.data, root = document.getElementById('root');
  var P = new URLSearchParams(location.search);

  if (!d.exams.length) {
    root.innerHTML = '<div class="empty"><div class="ico">' + SF.icons.quiz + '</div><h2 style="font-size:1.35rem">Create an exam first</h2>' +
      '<p class="muted small mt8">Quizzes are generated from your exam topics and uploaded notes.</p>' +
      '<a class="btn btn-primary mt20" href="create-exam.html">Create an exam</a></div>';
  } else {
    var exam = (P.get('exam') && SF.examById(P.get('exam'))) || d.exams.find(function (e) { return e.id === d.activeExamId; }) || d.exams[0];
    var mode = P.get('mode') || 'quiz';
    var presetTopic = P.get('topic');
    var presetCount = parseInt(P.get('count'), 10) || 0;
    var state = { questions: [], idx: 0, results: [], started: false, timer: null, left: 0 };

    var remainingFree = SF.isPro() ? Infinity : Math.max(0, SF.limits().aiQuestions - (d.aiQuestionsUsed || 0));

    /* ---------------------------------------------------- setup screen */
    function setup() {
      var pool = exam.topics.slice();
      if (!pool.length) {
        root.innerHTML = '<div class="empty"><div class="ico">' + SF.icons.plan + '</div><h2 style="font-size:1.35rem">Add topics to this exam</h2>' +
          '<a class="btn btn-primary mt20" href="create-exam.html?exam=' + exam.id + '">Add topics</a></div>';
        return;
      }
      var weakPool = pool.filter(function (t) { return t.mastery < 70; });
      var hasMaterial = (exam.materials || []).some(function (m) { return m.text && m.text.length > 200; });

      root.innerHTML =
        '<div class="card reveal">' +
          '<div class="row between wrapflex gap16">' +
            '<div><span class="badge badge-blue">' + (mode === 'practice' ? 'Practice exam' : mode === 'weak' ? 'Weak-topic drill' : 'Adaptive quiz') + '</span>' +
            '<h2 style="font-size:1.5rem" class="mt12">' + (mode === 'practice' ? 'Timed practice exam' : mode === 'weak' ? 'Target your weakest topics' : 'Test yourself on ' + SF.esc(exam.name)) + '</h2>' +
            '<p class="muted small mt8">' + (mode === 'practice'
              ? '15 questions across every topic, under time pressure. Your readiness score updates at the end.'
              : 'The AI picks questions from your material and weights the topics you\'re least confident in.') + '</p></div>' +
            '<div class="ring" style="--pct:' + SF.ai.readiness(exam) + ';--sz:104px"><div><b style="font-size:1.3rem">' + SF.ai.readiness(exam) + '%</b><span>now</span></div></div>' +
          '</div>' +

          (!hasMaterial ? '<div class="alert alert-info mt20 small">📄 <div><b>No readable material for this exam yet.</b> Questions will be a confidence check plus topic prompts. Upload typed notes or paste text in <a href="materials.html" style="color:var(--blue-300);font-weight:600">Materials</a> to get content-based questions pulled from your own wording.</div></div>' : '') +

          (mode !== 'practice' ? '<div class="mt24"><label class="small bold">Topics in this quiz</label>' +
            '<div class="chips mt12" id="topicChips">' + pool.map(function (t) {
              var on = presetTopic ? t.name === presetTopic : (mode === 'weak' ? t.mastery < 70 : true);
              return '<button class="chip' + (on ? ' on' : '') + '" data-value="' + SF.esc(t.name) + '" aria-pressed="' + (on ? 'true' : 'false') + '">' +
                SF.esc(t.name) + ' <span class="tiny muted">' + t.mastery + '%</span></button>';
            }).join('') + '</div></div>' : '') +

          '<div class="grid g3 mt24">' +
            '<div class="field"><label for="count">Questions</label><select class="select" id="count" ' + (mode === 'practice' ? 'disabled' : '') + '>' +
              [4, 6, 8, 10, 15, 20].map(function (n) { return '<option value="' + n + '"' + ((presetCount || (mode === 'practice' ? 15 : 8)) === n ? ' selected' : '') + '>' + n + ' questions</option>'; }).join('') +
            '</select></div>' +
            '<div class="field"><label for="examSel">Exam</label><select class="select" id="examSel">' +
              d.exams.map(function (e) { return '<option value="' + e.id + '"' + (e.id === exam.id ? ' selected' : '') + '>' + SF.esc(e.name) + '</option>'; }).join('') +
            '</select></div>' +
            '<div class="field"><label>Time</label><div class="input" style="opacity:.75">' + (mode === 'practice' ? '20 minutes (timed)' : 'Untimed') + '</div></div>' +
          '</div>' +

          '<div class="row between mt24 wrapflex gap12">' +
            '<span class="small ' + (remainingFree <= 10 ? '' : 'muted') + '">' + (SF.isPro() ? 'Pro — unlimited AI questions' : 'Free plan: <b>' + remainingFree + '</b> AI questions left') + '</span>' +
            '<div class="row gap10"><a class="btn btn-ghost" href="dashboard.html">Cancel</a><button class="btn btn-primary btn-lg" id="start">' + SF.icons.bolt + 'Start</button></div>' +
          '</div>' +
        '</div>' +

        (exam.quizzes && exam.quizzes.length ? '<div class="card mt20 reveal"><h3 class="mb12">Previous attempts</h3><table class="tbl"><thead><tr><th>When</th><th>Mode</th><th>Topics</th><th>Score</th></tr></thead><tbody>' +
          exam.quizzes.slice().reverse().map(function (q) {
            var pct = q.total ? Math.round(q.score / q.total * 100) : 0;
            return '<tr><td>' + SF.fmtDate(q.at.slice(0, 10), { day: 'numeric', month: 'short' }) + '</td><td>' + q.mode + '</td><td class="muted">' + (q.topics || []).join(', ') + '</td>' +
              '<td><span class="badge ' + (pct >= 75 ? 'badge-green' : pct >= 50 ? 'badge-amber' : 'badge-rose') + '">' + (q.total ? q.score + '/' + q.total + ' · ' + pct + '%' : 'self-rated') + '</span></td></tr>';
          }).join('') + '</tbody></table></div>' : '');

      var chips = document.getElementById('topicChips');
      if (chips) SF.chipGroup(chips, { multi: true });
      document.getElementById('examSel').onchange = function () {
        location.href = 'quiz.html?exam=' + this.value + (mode !== 'quiz' ? '&mode=' + mode : '');
      };
      document.getElementById('start').onclick = function () {
        var chosen = chips ? chips.querySelectorAll('.chip.on') : [];
        var topicNames = chips ? Array.prototype.map.call(chosen, function (c) { return c.dataset.value; }) : exam.topics.map(function (t) { return t.name; });
        if (!topicNames.length) return SF.toast('Pick at least one topic.');
        var count = mode === 'practice' ? 15 : parseInt(document.getElementById('count').value, 10);
        if (!SF.isPro() && count > remainingFree) { return SF.upsell('Unlimited AI questions'); }
        begin(topicNames, count);
      };
    }

    /* ---------------------------------------------------- question flow */
    function begin(topicNames, count) {
      var chosenTopics = exam.topics.filter(function (t) { return topicNames.indexOf(t.name) !== -1; });
      state.questions = SF.ai.buildQuestions(exam, chosenTopics, count);
      if (!state.questions.length) return SF.toast('No questions could be generated — add topics or upload notes.');
      state.idx = 0; state.results = []; state.started = true;

      // persist AI question usage
      var dd = SF.data();
      dd.aiQuestionsUsed = (dd.aiQuestionsUsed || 0) + state.questions.filter(function (q) { return q.fromMaterial; }).length;
      SF.saveData(dd);

      if (mode === 'practice') {
        state.left = 20 * 60;
        state.timer = setInterval(function () {
          state.left--;
          var el = document.getElementById('timer');
          if (el) el.textContent = String(Math.floor(state.left / 60)).padStart(2, '0') + ':' + String(state.left % 60).padStart(2, '0');
          if (state.left <= 0) { clearInterval(state.timer); SF.toast('Time is up — submitting.'); finish(); }
        }, 1000);
      }
      render();
    }

    function render() {
      var q = state.questions[state.idx];
      if (!q) return finish();
      var pct = Math.round(state.idx / state.questions.length * 100);
      root.innerHTML =
        '<div class="card">' +
          '<div class="row between wrapflex gap12 mb12">' +
            '<div class="row gap10"><span class="badge badge-blue">Question ' + (state.idx + 1) + ' / ' + state.questions.length + '</span>' +
            '<span class="badge">' + SF.esc(q.topic) + '</span>' + (q.confidence ? '<span class="badge badge-amber">self-check</span>' : q.fromMaterial ? '<span class="badge badge-green">from your notes</span>' : '') + '</div>' +
            (mode === 'practice' ? '<span class="badge badge-rose mono" id="timer">20:00</span>' : '<span class="badge mono">' + pct + '% done</span>') +
          '</div>' +
          '<div class="progress thin mb20"><i style="width:' + pct + '%"></i></div>' +
          '<h2 style="font-size:1.25rem;line-height:1.45">' + SF.esc(q.q) + '</h2>' +
          '<div class="stack gap10 mt20" id="opts">' +
            q.options.map(function (o, i) {
              return '<button class="option" data-o="' + SF.esc(o) + '"><span class="key">' + 'ABCD'[i] + '</span><span class="grow" style="text-align:left">' + SF.esc(o) + '</span></button>';
            }).join('') +
          '</div>' +
          '<div id="feedback" class="mt20"></div>' +
        '</div>';

      document.getElementById('opts').onclick = function (e) {
        var b = e.target.closest('[data-o]');
        if (b && !b.classList.contains('locked')) answer(b.dataset.o, b);
      };
    }

    function answer(choice, btn) {
      var q = state.questions[state.idx];
      var correct = q.confidence ? null : (choice === q.answer);
      document.querySelectorAll('#opts .option').forEach(function (o) {
        o.classList.add('locked');
        if (!q.confidence) {
          if (o.dataset.o === q.answer) o.classList.add('correct');
          else if (o === btn) o.classList.add('wrong');
        } else if (o === btn) {
          o.style.borderColor = 'rgba(56,189,248,.6)';
          o.style.background = 'rgba(56,189,248,.09)';
        }
      });

      state.results.push({ topic: q.topic, correct: correct, chosen: choice, confidence: !!q.confidence, fromMaterial: !!q.fromMaterial });

      var fb = document.getElementById('feedback');
      var isLast = state.idx === state.questions.length - 1;
      fb.innerHTML =
        '<div class="alert ' + (q.confidence ? 'alert-info' : correct ? 'alert-ok' : 'alert-error') + '">' +
          '<div><b>' + (q.confidence ? 'Logged' : correct ? 'Correct' : 'Not quite') + '</b>' +
          '<div class="small mt4" style="opacity:.9">' + (q.confidence ? 'Thanks — this self-rating is now part of your ' + SF.esc(q.topic) + ' confidence score.' : SF.esc(q.why || '')) + '</div></div>' +
        '</div>' +
        '<div class="row between mt16 wrapflex gap12">' +
          '<a class="tiny" style="color:var(--blue-300);font-weight:600" href="tutor.html?exam=' + exam.id + '&topic=' + encodeURIComponent(q.topic) + '">Confused? Ask the AI tutor →</a>' +
          '<button class="btn btn-primary" id="next">' + (isLast ? 'See my results' : 'Next question') + ' →</button>' +
        '</div>';
      document.getElementById('next').onclick = function () {
        state.idx++;
        if (state.idx >= state.questions.length) finish(); else render();
      };
    }

    /* ---------------------------------------------------- results */
    function finish(force) {
      if (!state.started) return;
      if (state.timer) clearInterval(state.timer);
      state.started = false;
      while (state.results.length < state.questions.length) {
        var q = state.questions[state.results.length];
        state.results.push({ topic: q.topic, correct: false, chosen: '(skipped)', confidence: !!q.confidence, fromMaterial: !!q.fromMaterial });
      }

      var before = SF.ai.readiness(exam);
      var dd = SF.data();
      var ex = dd.exams.find(function (x) { return x.id === exam.id; });
      SF.ai.applyResults(ex, state.results, mode);
      SF.saveData(dd);
      var after = ex.readiness;

      var graded = state.results.filter(function (r) { return !r.confidence; });
      var selfRated = state.results.filter(function (r) { return r.confidence; });
      var score = graded.filter(function (r) { return r.correct; }).length;
      var pct = graded.length ? Math.round(score / graded.length * 100) : null;

      var byTopic = {};
      state.results.forEach(function (r) {
        byTopic[r.topic] = byTopic[r.topic] || { c: 0, t: 0, self: [] };
        if (r.confidence) byTopic[r.topic].self.push(r.chosen);
        else { byTopic[r.topic].t++; if (r.correct) byTopic[r.topic].c++; }
      });
      var topicRows = Object.keys(byTopic).map(function (k) {
        var v = byTopic[k];
        var p = v.t ? Math.round(v.c / v.t * 100) : null;
        return { name: k, pct: p, self: v.self };
      }).sort(function (a, b) { return (a.pct === null ? 101 : a.pct) - (b.pct === null ? 101 : b.pct); });
      var worst = topicRows.find(function (r) { return r.pct !== null && r.pct < 70; });
      var nextExamStep = (ex.plan || []).find(function (day) { return day.date > SF.todayISO(); });

      root.innerHTML =
        '<div class="card reveal">' +
          '<div class="row between wrapflex gap20">' +
            '<div>' +
              '<span class="badge ' + (pct === null ? 'badge-blue' : pct >= 75 ? 'badge-green' : pct >= 50 ? 'badge-amber' : 'badge-rose') + '">' + (pct === null ? 'Self-assessment logged' : pct + '% score') + '</span>' +
              '<h2 style="font-size:1.5rem" class="mt12">' + (pct === null ? 'Baseline recorded' : pct >= 75 ? 'Strong session' : pct >= 50 ? 'Good progress — gaps found' : 'This one exposed real gaps') + '</h2>' +
              '<p class="muted small mt8">' + (graded.length ? score + ' of ' + graded.length + ' questions correct' : 'Confidence ratings logged') + (selfRated.length ? ' · ' + selfRated.length + ' self-check' + (selfRated.length > 1 ? 's' : '') : '') + '</p>' +
            '</div>' +
            '<div class="row gap20">' +
              '<div class="ring" style="--pct:' + before + ';--sz:100px"><div><b style="font-size:1.2rem">' + before + '%</b><span>before</span></div></div>' +
              '<div class="ring" style="--pct:' + after + ';--sz:100px"><div><b style="font-size:1.2rem">' + after + '%</b><span>after</span></div></div>' +
            '</div>' +
          '</div>' +

          (worst ? '<div class="alert alert-error mt20 small">🎯 <div><b>' + SF.esc(worst.name) + ' needs work (' + worst.pct + '%).</b> It\'s now flagged as your weakest topic and this week\'s plan has been re-weighted towards it.</div></div>'
                 : '<div class="alert alert-ok mt20 small">✓ <div><b>No topic dropped below 70%.</b> Your plan stays on its current track.</div></div>') +

          '<h3 class="mt24">Topic breakdown</h3>' +
          '<div class="stack mt8">' + topicRows.map(function (r) {
            var p = r.pct === null ? 0 : r.pct;
            var cls = r.pct === null ? '' : p < 55 ? 'amber' : p < 80 ? '' : 'green';
            return '<div class="topic-row"><div><div class="topic-name">' + SF.esc(r.name) + '</div>' +
              '<div class="topic-sub">' + (r.pct === null ? 'self-rated: ' + SF.esc(r.self.join(', ') || '—') : r.pct + '% correct in this session') + '</div></div>' +
              '<div class="progress thin ' + cls + '"><i style="width:' + (r.pct === null ? 40 : p) + '%"></i></div>' +
              '<div class="mono small" style="text-align:right">' + (r.pct === null ? '—' : p + '%') + '</div></div>';
          }).join('') + '</div>' +

          '<h3 class="mt24">Next up in your plan</h3>' +
          '<div class="stack gap10 mt12">' + (nextExamStep ? nextExamStep.items.slice(0, 3).map(function (i) {
            return '<div class="plan-item"><span class="plan-check"></span><div class="grow"><div class="plan-title">' + SF.esc(i.title) + '</div><div class="plan-meta">' + SF.fmtDay(nextExamStep.date) + ' · ' + i.minutes + ' min</div></div></div>';
          }).join('') : '<p class="small muted">Your plan is complete — time for the real thing. Good luck!</p>') + '</div>' +

          '<div class="row gap12 mt24 wrapflex">' +
            '<button class="btn btn-primary btn-lg" id="again">' + SF.icons.refresh + 'Take another</button>' +
            '<a class="btn btn-ghost btn-lg" href="exam.html?id=' + exam.id + '">See updated plan</a>' +
            '<a class="btn btn-ghost btn-lg" href="flashcards.html?exam=' + exam.id + (worst ? '&topic=' + encodeURIComponent(worst.name) : '') + '">' + SF.icons.cards + 'Flashcards' + (worst ? ' for ' + SF.esc(worst.name) : '') + '</a>' +
            '<a class="btn btn-quiet btn-lg" href="dashboard.html">Dashboard</a>' +
          '</div>' +
        '</div>' +
        '<p class="tiny muted center mt16" style="text-align:center">Readiness moved ' + (after >= before ? '+' : '') + (after - before) + ' points. The AI re-weights tomorrow\'s sessions automatically.</p>';

      document.getElementById('again').onclick = function () { location.reload(); };
      SF.reveal();
    }

    setup();
  }
</script>
</body>
</html>
