<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Study plan — StudyForgeAI</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/app.css" />
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="scrim" id="scrim"></div>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <div class="page page-wide" id="root"></div>
  </div>
</div>
<div class="modal" id="modal"></div>
<script src="assets/app.js"></script>
<script>
  var app = SF.mountApp({ active: 'plan', title: 'Study plan', crumb: 'StudyForgeAI · Plan' });
  if (!app) throw new Error('auth');
  var d = app.data, root = document.getElementById('root');

  if (!d.exams.length) {
    root.innerHTML = '<div class="empty"><div class="ico">' + SF.icons.plan + '</div><h2 style="font-size:1.35rem">No study plan yet</h2>' +
      '<p class="muted small mt8">Create an exam and the AI will build your day-by-day plan.</p>' +
      '<a class="btn btn-primary mt20" href="create-exam.html">Create an exam</a></div>';
  } else {
    var params = new URLSearchParams(location.search);
    var exam = (params.get('id') && SF.examById(params.get('id'))) || d.exams.find(function (e) { return e.id === d.activeExamId; }) || d.exams[0];

    if (!exam.plan) { SF.ai.generatePlan(exam); exam.readiness = SF.ai.readiness(exam); }
    if (exam.draft || !exam.topics.length) {
      root.innerHTML = '<div class="card"><span class="badge badge-amber">Almost there</span>' +
        '<h2 style="font-size:1.4rem" class="mt12">A few details are missing</h2>' +
        '<p class="muted small mt8">We need topics for <b style="color:var(--text)">' + SF.esc(exam.name) + '</b> before the AI can schedule sessions.</p>' +
        '<a class="btn btn-primary mt20" href="create-exam.html?exam=' + exam.id + '">Finish setup</a></div>';
    } else {
      var ready = SF.ai.readiness(exam);
      var weak = SF.ai.weakestTopic(exam);
      var col = SF.subjectColor(exam.subject);
      var items = [].concat.apply([], exam.plan.map(function (p) { return p.items; }));
      var doneCount = items.filter(function (i) { return i.done; }).length;
      var days = SF.daysBetween(SF.todayISO(), exam.date);
      var isActive = d.activeExamId === exam.id;
      var up = exam.topics.filter(function (t) { return t.mastery >= 75; }).length;

      root.innerHTML =
      '<div class="card reveal" style="border-color:' + hexA(col, .38) + '">' +
        '<div class="row between wrapflex gap20">' +
          '<div style="min-width:0">' +
            '<div class="row gap8 small muted"><span class="subject-dot" style="background:' + col + '"></span>' + SF.esc(exam.subject) + ' · ' + SF.esc(exam.yearLevel || '') + '</div>' +
            '<h2 style="font-size:1.8rem;margin-top:6px">' + SF.esc(exam.name) + '</h2>' +
            '<div class="row gap10 mt12 wrapflex">' +
              '<span class="badge ' + (days <= 3 ? 'badge-rose' : days <= 7 ? 'badge-amber' : 'badge-blue') + '">' + (days > 0 ? days + ' days remaining' : 'exam today') + '</span>' +
              '<span class="badge">' + SF.fmtDate(exam.date) + '</span>' +
              '<span class="badge">' + SF.minutesLabel(exam.dailyMinutes) + '/day</span>' +
              (isActive ? '<span class="badge badge-blue">active exam</span>' : '<button class="btn btn-ghost btn-sm" id="setActive">Set as active</button>') +
            '</div>' +
          '</div>' +
          '<div class="ring" style="--pct:' + ready + '"><div><b>' + ready + '%</b><span>readiness</span></div></div>' +
        '</div>' +
        '<div class="grid g4 mt24">' +
          tile(exam.topics.length, 'topics tracked') +
          tile(doneCount + '/' + items.length, 'sessions completed') +
          tile(exam.topics.filter(function (t) { return t.attempts === 0; }).length, 'not yet tested') +
          tile((exam.quizzes || []).length, 'quizzes taken') +
        '</div>' +
        '<div class="row gap10 mt20 wrapflex">' +
          '<a class="btn btn-primary" href="quiz.html?exam=' + exam.id + '">' + SF.icons.bolt + 'Study now</a>' +
          '<button class="btn btn-ghost" id="regen">' + SF.icons.refresh + 'Rebuild remaining plan</button>' +
          '<a class="btn btn-ghost" href="create-exam.html?exam=' + exam.id + '">Edit exam</a>' +
          '<button class="btn btn-danger" id="del">' + SF.icons.trash + 'Delete</button>' +
        '</div>' +
      '</div>' +

      '<div class="grid mt20" style="grid-template-columns:1.55fr 1fr;gap:20px">' +
        /* ---- plan ---- */
        '<div class="card reveal">' +
          '<div class="row between mb16 wrapflex gap10"><h3>Day-by-day plan</h3><span class="badge">' + exam.plan.length + ' days</span></div>' +
          '<div class="stack gap12">' + exam.plan.map(function (p) { return dayCard(p, exam, weak); }).join('') + '</div>' +
        '</div>' +

        '<div class="stack gap20">' +
          /* ---- topic mastery ---- */
          '<div class="card reveal">' +
            '<div class="row between mb12"><h3>Topic confidence</h3><a class="tiny" style="color:var(--blue-300);font-weight:600" href="progress.html">Details →</a></div>' +
            exam.topics.slice().sort(function (a, b) { return a.mastery - b.mastery; }).map(function (t) {
              var cls = t.mastery < 55 ? 'amber' : t.mastery < 80 ? '' : 'green';
              return '<div class="topic-row">' +
                '<div><div class="topic-name">' + SF.esc(t.name) + '</div>' +
                '<div class="topic-sub">' + (t.attempts ? t.attempts + ' attempt' + (t.attempts > 1 ? 's' : '') + ' · ' + t.correct + ' correct' : 'not tested yet') + '</div></div>' +
                '<div class="progress thin ' + cls + '"><i style="width:' + t.mastery + '%"></i></div>' +
                '<div class="mono small" style="text-align:right;color:' + (t.mastery < 55 ? '#fcd34d' : t.mastery < 80 ? 'var(--text-dim)' : '#6ee7b7') + '">' + t.mastery + '%</div>' +
              '</div>';
            }).join('') +
          '</div>' +

          /* ---- materials ---- */
          '<div class="card reveal">' +
            '<div class="row between mb12"><h3>Material</h3><a class="tiny" style="color:var(--blue-300);font-weight:600" href="materials.html">Manage →</a></div>' +
            ((exam.materials || []).length
              ? (exam.materials || []).map(function (m) {
                  return '<div class="file-item mb8"><span class="file-ico">' + SF.esc((m.kind || 'file').slice(0, 3).toUpperCase()) + '</span>' +
                    '<span class="grow" style="min-width:0"><b class="small" style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + SF.esc(m.name) + '</b>' +
                    '<span class="tiny muted">' + (m.text ? 'text extracted · ' + SF.ai.keyTerms(m.text, 999).length + ' terms' : 'indexed') + '</span></span></div>';
                }).join('')
              : '<p class="small muted">No material uploaded yet. Notes give the AI far better questions.</p>' +
                '<a class="btn btn-soft btn-block mt12" href="materials.html">Upload notes</a>') +
          '</div>' +

          /* ---- quiz history ---- */
          '<div class="card reveal">' +
            '<h3 class="mb12">Recent results</h3>' +
            ((exam.quizzes || []).length
              ? (exam.quizzes || []).slice(-5).reverse().map(function (q) {
                  var pct = q.total ? Math.round(q.score / q.total * 100) : 0;
                  return '<div class="row between" style="padding:8px 0;border-bottom:1px dashed rgba(148,178,224,.12)">' +
                    '<div><div class="small dim">' + (q.mode === 'practice' ? 'Practice exam' : q.mode === 'cards' ? 'Flashcards' : 'Quiz') + '</div>' +
                    '<div class="tiny muted">' + SF.fmtDate(q.at.slice(0, 10), { day: 'numeric', month: 'short' }) + ' · ' + (q.topics || []).join(', ') + '</div></div>' +
                    '<span class="badge ' + (pct >= 75 ? 'badge-green' : pct >= 50 ? 'badge-amber' : 'badge-rose') + '">' + (q.total ? q.score + '/' + q.total : '—') + '</span></div>';
                }).join('')
              : '<p class="small muted">No quizzes yet. Your first quiz sets a baseline for every topic.</p><a class="btn btn-soft btn-block mt12" href="quiz.html?exam=' + exam.id + '">Take a quiz</a>') +
          '</div>' +
        '</div>' +
      '</div>';
    }
  }

  function tile(v, l) { return '<div class="card card-flat stat"><b>' + v + '</b><span>' + l + '</span></div>'; }
  function hexA(hex, a) {
    var r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
  }

  function dayCard(p, exam, weak) {
    var total = p.items.reduce(function (a, i) { return a + i.minutes; }, 0);
    var done = p.items.filter(function (i) { return i.done; }).length;
    var isToday = p.date === SF.todayISO();
    var past = p.date < SF.todayISO();
    return '<div class="card card-flat" style="padding:16px;' + (isToday ? 'border-color:rgba(56,189,248,.5)' : '') + '">' +
      '<div class="row between wrapflex gap10 mb8">' +
        '<div class="row gap10"><b class="small">Day ' + p.day + '</b><span class="tiny muted">' + SF.fmtDay(p.date) + '</span>' +
        (isToday ? '<span class="badge badge-blue tiny">today</span>' : past ? '<span class="badge tiny">' + (done === p.items.length ? 'done' : 'missed') + '</span>' : '') + '</div>' +
        '<span class="tiny muted">' + total + ' min · ' + done + '/' + p.items.length + ' done</span>' +
      '</div>' +
      '<div class="stack gap8" data-day="' + p.day + '">' +
        p.items.map(function (it) {
          return '<div class="row gap10 small" style="padding:6px 0">' +
            '<button class="plan-check' + (it.done ? ' on' : '') + '" data-t="' + it.id + '" style="width:22px;height:22px">' + (it.done ? SF.icons.check : '') + '</button>' +
            '<span class="grow dim" style="' + (it.done ? 'text-decoration:line-through;opacity:.6' : '') + '">' + SF.esc(it.title) + '</span>' +
            '<span class="tiny muted nowrap">' + it.minutes + 'm</span>' +
            '<a class="tiny nowrap" style="color:var(--blue-300);font-weight:600" href="' + linkFor(it, exam) + '">' + (it.type === 'quiz' || it.type === 'mock' ? 'quiz' : it.type === 'flashcards' ? 'cards' : 'open') + ' →</a>' +
          '</div>';
        }).join('') +
      '</div></div>';
  }
  function linkFor(it, exam) {
    if (it.type === 'quiz') return 'quiz.html?exam=' + exam.id + '&topic=' + encodeURIComponent(it.topic) + '&count=6';
    if (it.type === 'mock') return 'quiz.html?exam=' + exam.id + '&mode=practice';
    if (it.type === 'flashcards') return 'flashcards.html?exam=' + exam.id + '&topic=' + encodeURIComponent(it.topic);
    if (it.type === 'review') return 'quiz.html?exam=' + exam.id + '&mode=weak';
    return 'tutor.html?exam=' + exam.id + '&topic=' + encodeURIComponent(it.topic);
  }

  document.getElementById('root').addEventListener('click', function (e) {
    var t = e.target.closest('[data-t]');
    if (t) {
      var dd = SF.data();
      var ex = dd.exams.find(function (x) { return x.id === (exam && exam.id); });
      if (!ex) return;
      ex.plan.forEach(function (p) { p.items.forEach(function (i) { if (i.id === t.dataset.t) i.done = !i.done; }); });
      ex.readiness = SF.ai.readiness(ex);
      SF.saveData(dd);
      location.reload();
      return;
    }
    if (e.target.closest('#setActive')) {
      var d2 = SF.data(); d2.activeExamId = exam.id; SF.saveData(d2);
      SF.toast('Active exam switched to ' + SF.esc(exam.name)); setTimeout(function () { location.reload(); }, 400);
    }
    if (e.target.closest('#regen')) {
      var d3 = SF.data(); var ex3 = d3.exams.find(function (x) { return x.id === exam.id; });
      SF.ai.regenerateRestOfPlan(ex3); ex3.readiness = SF.ai.readiness(ex3); SF.saveData(d3);
      SF.toast('✨ Remaining days rebuilt from your latest results.'); setTimeout(function () { location.reload(); }, 600);
    }
    if (e.target.closest('#del')) {
      SF.modal('Delete this exam?', '<p class="muted small">This removes the plan, quizzes and material for <b style="color:var(--text)">' + SF.esc(exam.name) + '</b>. This can\'t be undone.</p>',
        '<button class="btn btn-ghost" data-close>Keep it</button><button class="btn btn-danger grow" id="delYes">Delete exam</button>');
      document.getElementById('delYes').onclick = function () {
        var d4 = SF.data();
        d4.exams = d4.exams.filter(function (x) { return x.id !== exam.id; });
        d4.activeExamId = d4.exams[0] ? d4.exams[0].id : null;
        SF.saveData(d4); SF.closeModal();
        SF.toast('Exam deleted.'); setTimeout(function () { location.href = 'dashboard.html'; }, 500);
      };
    }
  });

  if (window.matchMedia('(max-width: 900px)').matches) {
    document.querySelectorAll('#root .grid').forEach(function (g) { if (g.style.gridTemplateColumns) g.style.gridTemplateColumns = '1fr'; });
  }
</script>
</body>
</html>
