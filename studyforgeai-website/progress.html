<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Exam Readiness — StudyForgeAI</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/app.css" />
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="scrim" id="scrim"></div>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <div class="page page-wide" id="root"></div>
  </div>
</div>
<div class="modal" id="modal"></div>
<script src="assets/app.js"></script>
<script>
  var app = SF.mountApp({ active: 'progress', title: 'Exam Readiness', crumb: 'StudyForgeAI · Tracking' });
  if (!app) throw new Error('auth');
  var d = app.data, root = document.getElementById('root');

  if (!d.exams.length) {
    root.innerHTML = '<div class="empty"><div class="ico">' + SF.icons.chart + '</div><h2 style="font-size:1.35rem">Nothing to track yet</h2>' +
      '<a class="btn btn-primary mt20" href="create-exam.html">Create an exam</a></div>';
  } else {
    var exam = d.exams.find(function (e) { return e.id === d.activeExamId; }) || d.exams[0];
    var ready = SF.ai.readiness(exam);
    var rp = SF.progressNote(ready);
    var topics = exam.topics.slice().sort(function (a, b) { return a.mastery - b.mastery; });
    var quizzes = (exam.quizzes || []).slice();
    var items = [].concat.apply([], (exam.plan || []).map(function (p) { return p.items; }));
    var doneItems = items.filter(function (i) { return i.done; }).length;
    var tested = exam.topics.filter(function (t) { return t.attempts > 0; });
    var avgAcc = tested.length ? Math.round(tested.reduce(function (a, t) { return a + t.mastery; }, 0) / tested.length) : 0;

    // simple sparkline of quiz scores
    function sparkline() {
      if (!quizzes.length) return '<p class="small muted">No quiz data yet — take a quiz and your trend appears here.</p>';
      var pts = quizzes.slice(-10).map(function (q) { return q.total ? Math.round(q.score / q.total * 100) : 50; });
      var w = 640, h = 140, step = pts.length > 1 ? w / (pts.length - 1) : w;
      var coords = pts.map(function (p, i) { return [i * step, h - (p / 100) * (h - 20) - 10]; });
      var path = coords.map(function (c, i) { return (i ? 'L' : 'M') + c[0].toFixed(1) + ' ' + c[1].toFixed(1); }).join(' ');
      var area = path + ' L' + w + ' ' + h + ' L0 ' + h + ' Z';
      return '<svg viewBox="0 0 ' + w + ' ' + h + '" style="width:100%;height:150px">' +
        '<defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#38bdf8" stop-opacity=".35"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></linearGradient></defs>' +
        '<path d="' + area + '" fill="url(#g1)"/><path d="' + path + '" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>' +
        coords.map(function (c) { return '<circle cx="' + c[0].toFixed(1) + '" cy="' + c[1].toFixed(1) + '" r="4" fill="#0d1628" stroke="#38bdf8" stroke-width="2.5"/>'; }).join('') +
        '</svg>' +
        '<div class="row between tiny muted"><span>' + quizzes.length + ' sessions</span><span>latest: ' + pts[pts.length - 1] + '%</span></div>';
    }

    root.innerHTML =
      '<div class="card reveal">' +
        '<div class="row between wrapflex gap16">' +
          '<div><span class="badge badge-blue">Readiness model</span>' +
          '<h2 style="font-size:1.5rem" class="mt12">' + SF.esc(exam.name) + '</h2>' +
          '<p class="muted small mt8">One score from three signals: how well you know each topic, how much of it you\'ve actually been tested on, and how much of the plan you\'ve completed.</p></div>' +
          '<div class="ring" style="--pct:' + ready + '"><div><b>' + ready + '%</b><span>readiness</span></div></div>' +
        '</div>' +
        '<div class="grid g4 mt24">' +
          tile(ready + '%', 'overall readiness') +
          tile(avgAcc + '%', 'average accuracy') +
          tile(tested.length + '/' + exam.topics.length, 'topics tested') +
          tile(Math.round(doneItems / Math.max(1, items.length) * 100) + '%', 'plan completed') +
        '</div>' +
      '</div>' +

      '<div class="grid mt20" style="grid-template-columns:1.4fr 1fr;gap:20px">' +
        '<div class="card reveal">' +
          '<div class="row between mb16"><h3>Topic mastery</h3><span class="badge ' + rp.cls + '">' + rp.label + '</span></div>' +
          '<p class="tiny muted mb16">Coverage: the share of your exam content the AI can currently reason about.</p>' +
          topics.map(function (t) {
            var cls = t.mastery < 55 ? 'amber' : t.mastery < 80 ? '' : 'green';
            return '<div class="topic-row"><div><div class="topic-name">' + SF.esc(t.name) + '</div>' +
              '<div class="topic-sub">' + (t.attempts ? t.attempts + ' attempt' + (t.attempts > 1 ? 's' : '') + ' · ' + t.correct + ' correct' : 'never tested') + '</div></div>' +
              '<div class="progress thin ' + cls + '"><i style="width:' + t.mastery + '%"></i></div>' +
              '<div class="mono small" style="text-align:right">' + t.mastery + '%</div></div>';
          }).join('') +
        '</div>' +

        '<div class="stack gap20">' +
          '<div class="card reveal"><h3 class="mb12">Accuracy trend</h3>' + sparkline() + '</div>' +
          '<div class="card reveal">' +
            '<h3 class="mb12">Momentum</h3>' +
            '<div class="stack gap12">' +
              momentum('Plan completion', Math.round(doneItems / Math.max(1, items.length) * 100)) +
              momentum('Topics above 80%', Math.round(exam.topics.filter(function (t) { return t.mastery >= 80; }).length / exam.topics.length * 100)) +
              momentum('Syllabus covered', Math.round(exam.topics.filter(function (t) { return t.attempts > 0; }).length / exam.topics.length * 100)) +
            '</div>' +
          '</div>' +
          '<div class="card card-flat reveal">' +
            '<h3 class="small">What would move the needle</h3>' +
            '<p class="small muted mt8">' + (topics[0] ? 'Nail <b style="color:var(--text)">' + SF.esc(topics[0].name) + '</b> (' + topics[0].mastery + '%) and your readiness jumps roughly <b style="color:var(--blue-300)">' + Math.max(2, Math.round((100 - topics[0].mastery) * 0.62 / Math.max(1, exam.topics.length))) + ' points</b>. Then keep the strong topics warm with short flashcard passes.' : '') + '</p>' +
          '</div>' +
        '</div>' +
      '</div>';

    function tile(v, l) { return '<div class="card card-flat stat"><b>' + v + '</b><span>' + l + '</span></div>'; }
    function momentum(label, pct) {
      return '<div><div class="row between small mb8"><span class="dim">' + label + '</span><span class="mono tiny muted">' + pct + '%</span></div>' +
        '<div class="progress thin"><i style="width:' + pct + '%"></i></div></div>';
    }
    if (window.matchMedia('(max-width: 900px)').matches) {
      document.querySelectorAll('#root .grid').forEach(function (g) { if (g.style.gridTemplateColumns) g.style.gridTemplateColumns = '1fr'; });
    }
  }
</script>
</body>
</html>
